apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: task-app

spec:

  replicas: 2

  strategy:

    type: RollingUpdate

    rollingUpdate:

      maxUnavailable: 0

      maxSurge: 1

  selector:

    matchLabels:

      app: backend

  template:

    metadata:

      labels:

        app: backend

    spec:

      containers:

        - name: backend

          image: task-backend:v1

          imagePullPolicy: IfNotPresent

          ports:

            - containerPort: 8080

          env:

            - name: DB_HOST

              valueFrom:

                configMapKeyRef:

                  name: task-config

                  key: DB_HOST

            - name: DB_PORT

              valueFrom:

                configMapKeyRef:

                  name: task-config

                  key: DB_PORT

            - name: DB_NAME

              valueFrom:

                configMapKeyRef:

                  name: task-config

                  key: DB_NAME

            - name: DB_USERNAME

              valueFrom:

                configMapKeyRef:

                  name: task-config

                  key: DB_USERNAME

            - name: DB_PASSWORD

              valueFrom:

                secretKeyRef:

                  name: task-secret

                  key: MYSQL_PASSWORD

          resources:

            requests:

              cpu: "100m"

              memory: "256Mi"

            limits:

              cpu: "500m"

              memory: "512Mi"

          readinessProbe:

            httpGet:

              path: /actuator/health

              port: 8080

            initialDelaySeconds: 20

            periodSeconds: 10

            timeoutSeconds: 3

            failureThreshold: 3

          livenessProbe:

            httpGet:

              path: /actuator/health

              port: 8080

            initialDelaySeconds: 40

            periodSeconds: 20

            timeoutSeconds: 3

            failureThreshold: 3
