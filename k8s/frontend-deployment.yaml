apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: task-app

spec:

  replicas: 2

  selector:

    matchLabels:

      app: frontend

  template:

    metadata:

      labels:

        app: frontend

    spec:

      containers:

        - name: frontend

          image: task-frontend:v1

          imagePullPolicy: IfNotPresent

          ports:

            - containerPort: 8088

          resources:

            requests:

              cpu: "50m"

              memory: "64Mi"

            limits:

              cpu: "200m"

              memory: "128Mi"

          readinessProbe:

            httpGet:

              path: /

              port: 8088

            initialDelaySeconds: 5

            periodSeconds: 10

          livenessProbe:

            httpGet:

              path: /

              port: 8088

            initialDelaySeconds: 10

            periodSeconds: 20
