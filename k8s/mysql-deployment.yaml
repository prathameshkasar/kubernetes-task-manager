apiVersion: apps/v1
kind: Deployment

metadata:
  name: mysql
  namespace: task-app

spec:

  replicas: 1

  selector:

    matchLabels:
      app: mysql

  template:

    metadata:

      labels:
        app: mysql

    spec:

      containers:

        - name: mysql

          image: mysql:8.0

          ports:

            - containerPort: 3306

          env:

            - name: MYSQL_ROOT_PASSWORD

              valueFrom:

                secretKeyRef:

                  name: task-secret

                  key: MYSQL_ROOT_PASSWORD

            - name: MYSQL_DATABASE

              value: taskdb

            - name: MYSQL_USER

              value: taskuser

            - name: MYSQL_PASSWORD

              valueFrom:

                secretKeyRef:

                  name: task-secret

                  key: MYSQL_PASSWORD

          resources:

            requests:

              cpu: "100m"

              memory: "256Mi"

            limits:

              cpu: "500m"

              memory: "512Mi"

          volumeMounts:

            - name: mysql-storage

              mountPath: /var/lib/mysql

      volumes:

        - name: mysql-storage

          persistentVolumeClaim:

            claimName: mysql-pvc
